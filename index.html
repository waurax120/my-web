<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube コメントランキング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header>
    <div class="badge">YouTube Comment Ranking</div>
    <h1>コメントランキング</h1>
    <p>チャンネル名を入力すると、最近の動画のコメントを集計します。</p>
  </header>

  <section class="search">
    <input id="channel" placeholder="例：HikakinTV" autocomplete="off">
    <input id="apiKey" type="password" placeholder="YouTube APIキー（初回だけ）">
    <div class="options">
      <label>動画数 <input id="videoLimit" type="number" min="1" max="50" value="10"></label>
      <label>1動画あたりのコメント数 <input id="commentsPerVideo" type="number" min="1" max="100" value="100"></label>
    </div>
    <button id="search">ランキングを見る</button>
    <small>※ APIキーはブラウザのlocalStorageには保存しません。</small>
  </section>

  <section id="status" class="status"></section>
  <section id="result" hidden>
    <div class="channel-card">
      <img id="thumb" alt="">
      <div><h2 id="channelTitle"></h2><p id="summary"></p></div>
    </div>
    <h2 class="section-title">🏆 コメントランキング</h2>
    <div id="ranking"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
