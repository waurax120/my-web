<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャット稼ぎチェッカー</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header><div class="brand">💬 <span>チャット稼ぎチェッカー</span></div></header>

<main>
<section id="home" class="screen active">
  <div class="hero">
    <h1>YouTubeのチャットを分析</h1>
    <p>コメント数・連投率・毎分コメント数などをまとめてチェック。</p>
    <div class="search"><input id="channelInput" placeholder="YouTubeチャンネル名を入力"><button id="analyzeBtn">分析する</button></div>
    <div id="error" class="error"></div>
  </div>
  <div class="grid two">
    <div class="card"><h2>🔴 LIVE中</h2><p class="muted">分析したチャンネルのLIVE情報がここに表示されます。</p><div id="liveHome">まだ分析していません。</div></div>
    <div class="card"><h2>⭐ お気に入り</h2><div id="favorites">まだありません。</div></div>
  </div>
</section>

<section id="analysis" class="screen">
  <div class="topbar"><button class="back" data-screen="home">← ホーム</button><div class="filters"><button class="filter active">今日</button><button class="filter">7日</button><button class="filter">30日</button><button class="filter">全期間</button></div></div>
  <div id="channelCard" class="channel card"></div>
  <div class="score card"><div><div class="label">💬 チャット稼ぎ度（サイト独自指標）</div><div id="score" class="big">-- / 100</div></div><div id="scoreText" class="badge">分析待ち</div></div>
  <div class="grid two">
    <div class="card"><h2>📊 普通のチャット vs 連投チャット</h2><canvas id="pie"></canvas><div id="rateText" class="stats"></div></div>
    <div class="card"><h2>📈 コメント数/分</h2><canvas id="minuteChart"></canvas><div id="minuteStats" class="stats"></div></div>
  </div>
  <div class="grid two">
    <div class="card"><h2>🚨 コメント急増</h2><div id="spikes">分析データがありません。</div></div>
    <div class="card"><h2>⏱️ コメント集中時間</h2><div id="peak">分析データがありません。</div></div>
  </div>
  <div class="card"><h2>👑 ユーザー分析</h2><div id="userPreview"></div><button class="wide" data-screen="ranking">ランキングを見る →</button></div>
</section>

<section id="ranking" class="screen">
  <div class="topbar"><button class="back" data-screen="analysis">← 分析</button></div>
  <h1>🏆 ランキング</h1>
  <div class="tabs"><button class="tab active" data-rank="comments">💬 コメント</button><button class="tab" data-rank="streak">🔥 連投</button><button class="tab" data-rank="users">👑 ユーザー</button></div>
  <div class="card"><input id="rankSearch" class="rankSearch" placeholder="🔍 コメント・ユーザーを検索"><div id="rankingList"></div></div>
</section>
</main>

<nav><button data-screen="home">🏠<small>ホーム</small></button><button data-screen="analysis">📊<small>分析</small></button><button data-screen="ranking">🏆<small>ランキング</small></button></nav>
<script src="/app.js"></script>
</body>
  </html>
